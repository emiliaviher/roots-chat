<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roots Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
:root{
  --ground:#FFFFFE; --ink:#141414; --ink-2:#55504C; --blush:#F7EDE8; --sage:#DFE6DD;
  --line:#E6DDD8; --panel:#FFFFFE; --bubble:#F4EEEA; --chip:#FFFFFE; --chip-hover:#F7EDE8;
  --btn:#141414; --btn-ink:#FFFFFE; --ok:#4F7A55; --shadow:0 18px 50px rgba(40,25,20,.16);
  --font:"Fugue","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#171514; --ink:#F3EEEA; --ink-2:#B5ACA6; --blush:#27211F; --sage:#232A24;
  --line:#3A3330; --panel:#1E1B1A; --bubble:#2A2523; --chip:#221F1D; --chip-hover:#2E2826;
  --btn:#F3EEEA; --btn-ink:#171514; --ok:#8DBB92; --shadow:0 18px 50px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --ground:#171514; --ink:#F3EEEA; --ink-2:#B5ACA6; --blush:#27211F; --sage:#232A24;
  --line:#3A3330; --panel:#1E1B1A; --bubble:#2A2523; --chip:#221F1D; --chip-hover:#2E2826;
  --btn:#F3EEEA; --btn-ink:#171514; --ok:#8DBB92; --shadow:0 18px 50px rgba(0,0,0,.5);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* mock site */
.site{min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--blush)}
.logo{font-weight:700;font-size:26px;letter-spacing:.02em}
.proto{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--ground)}
.notice{background:var(--sage);text-align:center;font-size:13px;padding:10px 16px}
.hero{flex:1;padding:56px 20px 200px;max-width:760px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.05;margin:0 0 6px;font-weight:600;text-wrap:balance}
.scribble{font-family:"Caveat",cursive;font-size:22px;color:var(--ink-2);margin:0 0 22px}
.hero p{max-width:34em;color:var(--ink-2);margin:0 0 14px}
.hero .hint{font-size:13px;border-left:2px solid var(--line);padding-left:12px}

/* dock */
.dock{position:fixed;right:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 40px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px 12px;z-index:5}
.ask{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 6px;text-align:left;cursor:pointer;border-radius:10px}
.ask:hover{background:var(--chip-hover)}
.ask svg{flex:none}
.ask span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:6px 2px;border-radius:12px;font-size:12.5px}
.quick button:hover{background:var(--chip-hover)}
.quick i{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blush);font-style:normal}

/* chat */
.chat{position:fixed;right:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));height:min(680px,calc(100% - 32px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px)));background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.chat header{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:var(--ink);color:var(--ground)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ground);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.chat header b{display:block;font-weight:600}
.chat header small{display:flex;align-items:center;gap:6px;opacity:.8;font-size:12px}
.chat header small::before{content:"";width:7px;height:7px;border-radius:50%;background:#8DBB92}
.hbtn{margin-left:auto;display:flex;gap:4px}
.hbtn button{border:0;background:none;color:inherit;width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.hbtn button:hover{background:rgba(255,255,255,.12)}
.log{position:relative;flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;animation:in .25s ease-out both}
.bot{background:var(--bubble);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:18px}.msg li{margin:2px 0}
.msg a{font-weight:600}
.plist{margin:6px 0 8px}
.plist h4{margin:10px 0 2px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.plist h4:first-child{margin-top:0}
.prow{padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prow b{font-weight:600}
.prow div span{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow small{display:block;color:var(--ink-2);font-size:12px;line-height:1.35}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:1px;color:var(--ink-2);background:var(--panel)}
.opts{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.opts button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 12px;cursor:pointer}
.opts button:hover{background:var(--chip-hover);border-color:var(--ink-2)}
.opts kbd{font:inherit;font-size:11px;font-weight:600;width:22px;height:22px;border-radius:6px;background:var(--blush);display:grid;place-items:center;flex:none}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.menu{display:grid;grid-template-columns:1fr 1fr}
.opts.menu button{flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;line-height:1.25}
.opts.menu button small{color:var(--ink-2);font-size:12px}
.msg.wide{max-width:100%;align-self:stretch}
.cards{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.cgrp{margin:12px 0 0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.ccard .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ccard .ch b{font-size:15px}
.ccard .ch .tag{margin-left:0}
.ccard p{margin:4px 0 0!important;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.tbtn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;border:0;background:var(--blush);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{background:var(--sage)}
.tbtn i{font-style:normal;font-weight:400;color:var(--ink-2)}
.slots{margin:4px 0 6px}
.slots h4{margin:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.slots h4:first-child{margin-top:2px}
a.slot{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:400;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:5px 0}
a.slot:hover{border-color:var(--ink-2)}
.slot .st{font-weight:700;font-variant-numeric:tabular-nums;min-width:42px}
.slot .sb{flex:1;min-width:0}
.slot .sb small{display:block;color:var(--ink-2);font-size:12px}
.slot .ss{font-size:11px;border-radius:99px;padding:2px 8px;white-space:nowrap}
.ss.ok{background:#E3EEE3;color:#2F5A35}.ss.low{background:#F6E7CF;color:#7A4E0E}.ss.full{background:#F3DCD8;color:#8A2F22}
.slot .sgo{font-size:20px;line-height:1;color:var(--ink-2)}
.snap{font-size:12px;color:var(--ink-2)}

.evlist{margin:4px 0 8px}
.evlist h4{margin:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.evlist h4:first-child{margin-top:2px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.evd{flex:none;width:52px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center;padding:4px 0 5px;line-height:1.1}
.evd small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.evd b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.evb{flex:1;min-width:0}
.evb b{display:block;font-weight:600;line-height:1.3}
.evb small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.evp{flex:none;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.opts.row button{border-radius:99px;padding:6px 12px}
.choices{display:flex;flex-direction:column;gap:6px;align-self:stretch;animation:in .25s .05s ease-out both}
.chint{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:2px 2px 0}
.navrow{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.navbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink-2);font-size:13px;padding:4px 2px;cursor:pointer}
.navbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.opts .nav + .nav{}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
form{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line)}
form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:10px 14px;font:inherit;background:var(--ground);color:var(--ink)}
form button{border:0;border-radius:50%;width:42px;height:42px;background:var(--btn);color:var(--btn-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.foot{font-size:11px;color:var(--ink-2);text-align:center;padding:0 12px 10px}
@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* states: bar / minimized / open */
.dock{padding-top:14px}
.dclose{position:absolute;top:-12px;right:-8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dclose:hover{color:var(--ink);border-color:var(--ink-2)}
.dock.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.launch{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lbtn{display:flex;align-items:center;gap:10px;border:0;background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:14px 20px 14px 16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
.lbtn:hover{transform:translateY(-1px)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.teaser{position:relative;max-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 4px 16px;box-shadow:var(--shadow);padding:12px 32px 12px 14px;font-size:14px;line-height:1.4;cursor:pointer;animation:pop .35s ease-out both}
.teaser b{display:block}
.teaser .tx{position:absolute;top:6px;right:6px;width:22px;height:22px;border:0;background:none;color:var(--ink-2);cursor:pointer;border-radius:6px;display:grid;place-items:center}
.chat.enter{animation:open .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom right}
@keyframes open{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 28px;background:var(--panel);padding:14px;border:1px dashed var(--line);border-radius:14px;max-width:34em}
.demo span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);width:100%}
.demo button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px;cursor:pointer}
.demo button:hover{border-color:var(--ink-2)}
.demo button.on{background:var(--ink);color:var(--btn-ink);border-color:var(--ink)}
.phone{position:fixed;inset:0;z-index:50;background:rgba(20,16,14,.55);display:grid;place-items:center;padding:16px}
.phone-frame{position:relative;width:min(390px,100%);height:min(780px,calc(100% - 20px));border-radius:44px;background:#111;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.phone-frame iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff}
.phone-close{position:absolute;top:-6px;right:-6px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#141414;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.inframe .demo{display:none}
.demo .mrow{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding-bottom:10px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.demo .mdesc{width:100%;font-size:13px;color:var(--ink-2);margin:0 0 4px}
.demo button.mode.on{background:var(--sage);color:var(--ink);border-color:var(--ink-2)}
@media (max-width:520px){
  .chat{inset:0;right:0;bottom:0;width:100%;height:100%;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .chat.enter{animation:slideup .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .dock{right:10px;width:calc(100% - 20px);bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .dclose{right:-4px}
  .quick button{font-size:11.5px}
  .launch{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .lbtn{width:60px;height:60px;padding:0;justify-content:center}
  .lbtn span{display:none}
  .mode-b .dock .quick{display:none}
  .mode-b .dock{padding:10px 12px}
}
</style>
